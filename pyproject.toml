[project]
name = "cryptocurrent-bot"
version = "0.1.0"
description = "A Telegram bot for cryptocurrency prices"
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "feedparser>=6.0.12",
    "google-genai>=1.47.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=20.0",
    "requests>=2.32.5",
    "setuptools>=82.0.1",
]

[tool.black]
line-length = 88
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

